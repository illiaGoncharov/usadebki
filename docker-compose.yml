services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: usadebki
      POSTGRES_PASSWORD: usadebki
      POSTGRES_DB: usadebki
    ports:
      - "5434:5432"
    volumes:
      - usadebki-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usadebki -d usadebki"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  usadebki-pg:
